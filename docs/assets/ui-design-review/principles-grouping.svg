<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="692" role="img" viewBox="0 0 1000 692"><title>Section separation must exceed the heading-to-content gap</title><rect width="1000" height="692" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="32" fill="#5d6878" font-size="16" font-weight="400" text-anchor="start">GROUPING · schematic, not an application capture</text><text x="28" y="72" fill="#9b4747" font-size="22" font-weight="600" text-anchor="start">Ambiguous section boundary</text><rect width="450" height="510" x="28" y="92" fill="#f8f9fb" stroke="#d9dfe7" rx="16"/><text x="52" y="133" fill="#263044" font-size="18" font-weight="600" text-anchor="start">Members</text><rect width="320" height="72" x="52" y="156" fill="#fff" stroke="#d9dfe7" rx="10"/><circle cx="74" cy="184" r="7" fill="none" stroke="#647184" stroke-width="1.5"/><text x="93" y="189" fill="#263044" font-size="16" font-weight="400" text-anchor="start">Lead</text><text x="93" y="211" fill="#707b8a" font-size="13" font-weight="400" text-anchor="start">Available</text><rect width="320" height="72" x="52" y="244" fill="#fff" stroke="#d9dfe7" rx="10"/><circle cx="74" cy="272" r="7" fill="none" stroke="#647184" stroke-width="1.5"/><text x="93" y="277" fill="#263044" font-size="16" font-weight="400" text-anchor="start">Reviewer</text><text x="93" y="299" fill="#707b8a" font-size="13" font-weight="400" text-anchor="start">Available</text><text x="52" y="350" fill="#263044" font-size="18" font-weight="600" text-anchor="start">Shared tasks</text><rect width="320" height="110" x="52" y="366" fill="#fff" stroke="#d9dfe7" rx="10"/><text x="68" y="397" fill="#263044" font-size="16" font-weight="600" text-anchor="start">Review the interface</text><text x="68" y="422" fill="#647184" font-size="14" font-weight="400" text-anchor="start">Compare axes and grouping.</text><text x="68" y="449" fill="#707b8a" font-size="13" font-weight="400" text-anchor="start">Owner: Reviewer</text><path stroke="#b86565" stroke-width="1.5" d="M396 316 L396 330"/><path stroke="#b86565" stroke-width="1.5" d="M391 316 L401 316"/><path stroke="#b86565" stroke-width="1.5" d="M391 330 L401 330"/><text x="406" y="328" fill="#b86565" font-size="15" font-weight="600" text-anchor="start">G</text><path stroke="#647184" stroke-width="1.5" d="M396 354 L396 366"/><path stroke="#647184" stroke-width="1.5" d="M391 354 L401 354"/><path stroke="#647184" stroke-width="1.5" d="M391 366 L401 366"/><text x="406" y="365" fill="#647184" font-size="15" font-weight="600" text-anchor="start">g</text><text x="52" y="565" fill="#9b4747" font-size="16" font-weight="400" text-anchor="start">G ≈ g: the heading floats</text><text x="522" y="72" fill="#206d58" font-size="22" font-weight="600" text-anchor="start">Nested relationships</text><rect width="450" height="510" x="522" y="92" fill="#f8f9fb" stroke="#d9dfe7" rx="16"/><text x="546" y="133" fill="#263044" font-size="18" font-weight="600" text-anchor="start">Members</text><rect width="320" height="72" x="546" y="156" fill="#fff" stroke="#d9dfe7" rx="10"/><circle cx="568" cy="184" r="7" fill="none" stroke="#647184" stroke-width="1.5"/><text x="587" y="189" fill="#263044" font-size="16" font-weight="400" text-anchor="start">Lead</text><text x="587" y="211" fill="#707b8a" font-size="13" font-weight="400" text-anchor="start">Available</text><rect width="320" height="72" x="546" y="244" fill="#fff" stroke="#d9dfe7" rx="10"/><circle cx="568" cy="272" r="7" fill="none" stroke="#647184" stroke-width="1.5"/><text x="587" y="277" fill="#263044" font-size="16" font-weight="400" text-anchor="start">Reviewer</text><text x="587" y="299" fill="#707b8a" font-size="13" font-weight="400" text-anchor="start">Available</text><text x="546" y="388" fill="#263044" font-size="18" font-weight="600" text-anchor="start">Shared tasks</text><rect width="320" height="110" x="546" y="404" fill="#fff" stroke="#d9dfe7" rx="10"/><text x="562" y="435" fill="#263044" font-size="16" font-weight="600" text-anchor="start">Review the interface</text><text x="562" y="460" fill="#647184" font-size="14" font-weight="400" text-anchor="start">Compare axes and grouping.</text><text x="562" y="487" fill="#707b8a" font-size="13" font-weight="400" text-anchor="start">Owner: Reviewer</text><path stroke="#20826a" stroke-width="1.5" d="M890 316 L890 368"/><path stroke="#20826a" stroke-width="1.5" d="M885 316 L895 316"/><path stroke="#20826a" stroke-width="1.5" d="M885 368 L895 368"/><text x="900" y="347" fill="#20826a" font-size="15" font-weight="600" text-anchor="start">G</text><path stroke="#647184" stroke-width="1.5" d="M890 392 L890 404"/><path stroke="#647184" stroke-width="1.5" d="M885 392 L895 392"/><path stroke="#647184" stroke-width="1.5" d="M885 404 L895 404"/><text x="900" y="403" fill="#647184" font-size="15" font-weight="600" text-anchor="start">g</text><text x="546" y="565" fill="#206d58" font-size="16" font-weight="400" text-anchor="start">G &gt; g: heading belongs below</text><text x="28" y="637" fill="#263044" font-size="16" font-weight="400" text-anchor="start">Pair → repeated unit → section: preserve spacing differences at each level.</text><text x="28" y="665" fill="#5d6878" font-size="16" font-weight="400" text-anchor="start">More internal complexity needs a clearer outer separation, not larger gaps everywhere.</text></g></svg>